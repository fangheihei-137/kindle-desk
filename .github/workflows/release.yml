name: Publish release
on:
  push:
    branches: [main]
    paths: ['scripts/build_release.py', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kindle-desk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - run: python install.py --check
      - run: python -m unittest discover -s tests -q
      - run: python scripts/build_release.py
      - name: Publish tested archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "from scripts.build_release import VERSION; print(VERSION)")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$VERSION" "dist/kindle-desk-$VERSION.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Kindle Desk v$VERSION · 老 Kindle 模块化看板" \
            --notes-file CHANGELOG.md --latest
